[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pare-video"
version = "0.1.0"
description = "One-command polish for screen-recorded videos: cut pauses, fix loudness, burn captions, add a teaser and chapters."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "gruz0" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["ffmpeg", "obs", "video", "silence", "jump-cut", "captions", "youtube"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/gruz0/pare"
Issues = "https://github.com/gruz0/pare/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
pare = "pare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic punctuation is matched on purpose (transcripts contain it).
ignore = ["RUF001"]
